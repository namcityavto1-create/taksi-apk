name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          cat > settings.gradle <<'EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TaxiApp"
          include ':app'
          EOF_0
          cat > build.gradle <<'EOF_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          # >>> FAQAT SHU QATORNI O'ZGARTIRING: Render sayt manzili (oxirida / belgisiz) <<<
          BASE_URL=https://savdouz-app.onrender.com
          EOF_2
          mkdir -p app
          cat > app/build.gradle <<'EOF_3'
          plugins {
              id 'com.android.application'
          }

          def baseUrl = project.findProperty('BASE_URL') ?: 'https://savdouz-app.onrender.com'

          android {
              namespace 'uz.taxi.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'uz.taxi.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildFeatures { buildConfig true }

              flavorDimensions 'role'
              productFlavors {
                  driver {
                      dimension 'role'
                      applicationIdSuffix '.driver'
                      resValue 'string', 'app_name', 'Taksi Haydovchi'
                      buildConfigField 'String', 'START_URL', "\"${baseUrl}/taxi\""
                  }
                  admin {
                      dimension 'role'
                      applicationIdSuffix '.admin'
                      resValue 'string', 'app_name', 'Taksi Admin'
                      buildConfigField 'String', 'START_URL', "\"${baseUrl}/taxi-admin\""
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/java/uz/taxi/app
          cat > app/src/main/java/uz/taxi/app/MainActivity.java <<'EOF_5'
          package uz.taxi.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;
          import android.widget.FrameLayout;

          public class MainActivity extends Activity {

              private WebView web;
              private ProgressBar progress;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int REQ_FILE = 1;
              private static final int REQ_PERMS = 2;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  FrameLayout root = new FrameLayout(this);
                  web = new WebView(this);
                  root.addView(web, new FrameLayout.LayoutParams(-1, -1));

                  progress = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progress.setMax(100);
                  FrameLayout.LayoutParams pl = new FrameLayout.LayoutParams(-1, 8);
                  root.addView(progress, pl);
                  setContentView(root);

                  requestPermissions(new String[]{
                          Manifest.permission.CAMERA,
                          Manifest.permission.ACCESS_FINE_LOCATION,
                          Manifest.permission.ACCESS_COARSE_LOCATION
                  }, REQ_PERMS);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);

                  CookieManager.getInstance().setAcceptCookie(true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          String scheme = u.getScheme() == null ? "" : u.getScheme();
                          Uri start = Uri.parse(BuildConfig.START_URL);
                          boolean sameHost = u.getHost() != null && u.getHost().equals(start.getHost());
                          if ((scheme.equals("http") || scheme.equals("https")) && sameHost) return false;
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception ignored) { }
                          return true;
                      }

                      @Override
                      public void onPageStarted(WebView v, String url, Bitmap f) {
                          progress.setVisibility(View.VISIBLE);
                      }

                      @Override
                      public void onPageFinished(WebView v, String url) {
                          progress.setVisibility(View.GONE);
                      }

                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) {
                              v.loadData("<html><body style='font-family:sans-serif;text-align:center;padding:40px'>"
                                      + "<h2>Internet yo'q yoki server uyg'onmoqda</h2>"
                                      + "<p>Biroz kuting va qayta urinib ko'ring.</p>"
                                      + "<button style='font-size:18px;padding:12px 24px' onclick=\"location.href='"
                                      + BuildConfig.START_URL + "'\">Qayta yuklash</button></body></html>",
                                      "text/html", "UTF-8");
                          }
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView v, int p) {
                          progress.setProgress(p);
                      }

                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback cb) {
                          cb.invoke(origin, true, false);
                      }

                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          try {
                              startActivityForResult(params.createIntent(), REQ_FILE);
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl(BuildConfig.START_URL);
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == REQ_FILE && filePathCallback != null) {
                      filePathCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      filePathCallback = null;
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onPause() { super.onPause(); web.onPause(); CookieManager.getInstance().flush(); }

              @Override
              protected void onResume() { super.onResume(); web.onResume(); }
          }
          EOF_5
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_6'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFC107" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#111111" android:pathData="M26,62 L33,46 Q35,41 40,41 L68,41 Q73,41 75,46 L82,62 L82,72 L26,72 Z"/>
              <path android:fillColor="#FFC107" android:pathData="M38,47 L70,47 L74,58 L34,58 Z"/>
              <path android:fillColor="#111111" android:pathData="M36,74 a7,7 0 1,0 14,0 a7,7 0 1,0 -14,0 M58,74 a7,7 0 1,0 14,0 a7,7 0 1,0 -14,0"/>
          </vector>
          EOF_6
